<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Mini Golf Score: a putting green with a windmill, a flag in the cup and a ball rolling home">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8f3"/>
      <stop offset="1" stop-color="#e3efe6"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b8f59"/>
      <stop offset="1" stop-color="#0f6a40"/>
    </linearGradient>
    <pattern id="mow" width="80" height="400" patternUnits="userSpaceOnUse">
      <rect width="40" height="400" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="400" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#sky)"/>

    <!-- sun + clouds -->
    <circle cx="1080" cy="80" r="44" fill="#f1bd45" opacity="0.9"/>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="860" cy="70" rx="58" ry="18"/>
      <ellipse cx="895" cy="58" rx="34" ry="18"/>
      <ellipse cx="200" cy="56" rx="46" ry="14"/>
    </g>

    <!-- putting green -->
    <path d="M0 250 C 220 205, 420 225, 640 238 S 1020 215, 1200 232 L1200 400 L0 400 Z" fill="url(#felt)"/>
    <path d="M0 250 C 220 205, 420 225, 640 238 S 1020 215, 1200 232 L1200 400 L0 400 Z" fill="url(#mow)"/>
    <!-- bumper rail -->
    <path d="M0 250 C 220 205, 420 225, 640 238 S 1020 215, 1200 232" fill="none" stroke="#c98a3a" stroke-width="10" stroke-linecap="round"/>

    <!-- windmill -->
    <g transform="translate(965 238)">
      <path d="M-34 0 L-22 -120 L22 -120 L34 0 Z" fill="#dc2626"/>
      <path d="M-22 -120 L0 -150 L22 -120 Z" fill="#9b1c1c"/>
      <rect x="-12" y="-38" width="24" height="38" rx="12" fill="#3b2410"/>
      <rect x="-9" y="-95" width="18" height="18" rx="3" fill="#f7f8f3"/>
      <g transform="translate(0 -122) rotate(18)" fill="#f7f8f3" stroke="#d6d9cf" stroke-width="3">
        <rect x="-6" y="-92" width="12" height="92" rx="4"/>
        <rect x="-6" y="0" width="12" height="92" rx="4"/>
        <rect x="-92" y="-6" width="92" height="12" rx="4"/>
        <rect x="0" y="-6" width="92" height="12" rx="4"/>
      </g>
      <circle cx="0" cy="-122" r="9" fill="#f1bd45"/>
    </g>

    <!-- cup + flag -->
    <ellipse cx="760" cy="318" rx="26" ry="9" fill="#0a2e1c"/>
    <path d="M760 316 V170" stroke="#f7f8f3" stroke-width="7" stroke-linecap="round"/>
    <path d="M763 172 l64 20 -64 22 z" fill="#f1bd45"/>

    <!-- putt line + ball -->
    <path d="M520 352 C 600 340, 690 336, 736 322" fill="none" stroke="#f7f8f3" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.85"/>
    <circle cx="508" cy="354" r="15" fill="#ffffff"/>
    <circle cx="503" cy="349" r="2" fill="#d6d9cf"/>
    <circle cx="512" cy="352" r="2" fill="#d6d9cf"/>
    <circle cx="506" cy="359" r="2" fill="#d6d9cf"/>

    <!-- scorecard chips -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800">
      <rect x="1050" y="300" width="112" height="48" rx="24" fill="#fff7e6" stroke="#c98a1a" stroke-width="3"/>
      <text x="1106" y="332" text-anchor="middle" font-size="22" fill="#6b4300">ACE!</text>
    </g>

    <!-- title -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="64" y="124" font-size="72" font-weight="900" fill="#13271c" letter-spacing="-2">Mini Golf Score</text>
      <text x="66" y="172" font-size="26" font-weight="600" fill="#4b5a50">Score the round in your hand. No signal required.</text>
    </g>
  </g>
</svg>
